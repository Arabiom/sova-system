<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141C33" />
    <title>محور الأعمال المتكاملة — نظام إدارة المعارض</title>
    <script>
      // night mode chosen before: applied before the page draws (no white flash)
      try { var t = localStorage.getItem('sova.theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="احجز مساحتك في معارض SOVA — أرسل طلب حجز أو استفسار لمحور الأعمال المتكاملة لتنظيم المعارض." />
    <!-- Link preview when the booking link (/book) is shared on WhatsApp / Instagram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="محور الأعمال المتكاملة — SOVA" />
    <meta property="og:title" content="احجز مساحتك في معارض SOVA" />
    <meta property="og:description" content="طلب حجز أو استفسار — نتواصل معك في أقرب وقت" />
    <meta property="og:image" content="https://arabiom.github.io/sova-system/og-book.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_OM" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
