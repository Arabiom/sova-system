# Supabase pauses free-plan projects after about a week without activity, which takes the
# SOVA system offline until someone presses "Restore". This sends one small read request
# every day so the project stays active. It only reads (and, because of the access rules,
# an anonymous request sees no rows) — it never changes data.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 4 * * *' # daily at 04:17 UTC (08:17 Muscat)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database through the REST API
        env:
          SUPABASE_URL: https://gsfibkrshtnhzfagiowp.supabase.co
          SUPABASE_KEY: sb_publishable_HJqdg1pNFNvNp8nBoM4PHQ_rqGUDXYG
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/exhibitions?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
