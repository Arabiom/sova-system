# Publishes the site to GitHub Pages on every change to main (free, no build limit):
# https://arabiom.github.io/sova-system/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The site's address. With a domain of the company's own, write it here (e.g.
          # https://www.example.om/) — and add the same domain in Settings → Pages.
          SITE_URL: https://arabiom.github.io/sova-system/
          COMMIT_REF: ${{ github.sha }}
      # The public pages get their own files (200 + their own preview); any other page loads the app (404.html).
      - run: node scripts/public-pages.mjs
        env:
          SITE_URL: https://arabiom.github.io/sova-system/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
